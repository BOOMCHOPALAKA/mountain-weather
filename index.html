<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mountain Weather</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 27 12 9l5 8 4-5 9 15z' fill='%231F5D88'/%3E%3Cpath d='m12 9 3 5-3-1-2 2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Public+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brandbox"><h1 class="brand">Mountain Weather</h1><span class="asof-t">Loading…</span></div>
      <div class="asof">
        <button class="btn-quiet" type="button" id="refresh">Refresh</button>
      </div>
    </div>
    <div class="seg" role="group" aria-label="Activity">
      <button type="button" data-top="ski" aria-pressed="true">Ski</button>
      <button type="button" data-top="hike" aria-pressed="false">Hike</button>
    </div>
    <div class="seg2" id="sub" role="group" aria-label="Ski view">
      <button type="button" data-sub="resorts" aria-pressed="true">Resorts</button>
      <button type="button" data-sub="backcountry" aria-pressed="false">Backcountry</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap" id="foot"></footer>

<script type="module" src="app.js"></script>
</body>
</html>
